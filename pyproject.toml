[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hermes-service-tui"
version = "0.2.0"
description = "Dynamic TUI for managing profile-aware Hermes Agent systemd user services on WSL2/Linux"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "textual>=0.80",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
build = ["pyinstaller>=6.0"]

[project.scripts]
hermes-service-tui = "hermes_service_tui.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hermes_service_tui"]
